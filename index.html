<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="shortcut icon"
      href="assets/images/web/icon.png"
      type="image/x-icon"
    />
    <script
      src="https://kit.fontawesome.com/fa37d9694f.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- <header>Welcome to HELL </header>
    <p>This is where you'll experience HELL</p>  the HELL will be a hover effect when one moves their mouse towards that area it will reveal its letter as H-E-L-L one by one slowly 1 word/sec in red font with blood drooling"
     -->

    <!-- This will be my apps container and bottom taskbar section -->
    <div class="os-container">
      <div id="os-apps">
        <div class="app">
          <img src="assets/images/apps/file-manager.png" alt="file-manager" />
          <p>File Manager</p>
        </div>
      </div>
      <div id="taskbar"></div>
    </div>
    <!-- App window -->
    <div class="os-window" draggable="true">
      <!-- This will be my top window -->
      <div class="window-bar">
        <!-- Icons -->
        <div class="brand">
          <img src="assets/images/apps/file-manager.png" alt="file-manager" />
        </div>

        <!-- Buttons for cross,minimize,full-screen -->
        <div class="buttons">
          <button id="maximize">
            <i class="fa fa-window-maximize"></i>
          </button>
          <button id="shorter">
            <i class="fa fa-window-restore"></i>
          </button>
          <button id="cross">
            <i class="fa fa-times"></i>
          </button>
        </div>
      </div>

      <!-- This will be my main app -->
      <div class="app" id="app-main"></div>
    </div>

    <div class="app-hide"></div>

    <!-- Context menu -->
    <nav id="os-menu">
      <ul>
        <li><a href="javascript:;">Open</a></li>
        <li><a href="javascript:;">Open as admin</a></li>
        <li><a href="javascript:;">Remove</a></li>
        <li><a href="javascript:;">Properties</a></li>
      </ul>
    </nav>
    <script src="assets/js/script.js"></script>
  </body>
</html>
